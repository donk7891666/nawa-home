<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>奶娃大笑时的画面</title>
  <style>
    *{box-sizing:border-box} body{margin:0;padding:24px;background:#f4eee2;color:#2e302d;font-family:"Microsoft YaHei",system-ui,sans-serif} main{max-width:820px;margin:auto}h1{text-align:center;margin:0;font-size:clamp(25px,5vw,40px)}.sub{text-align:center;color:#665f56;margin:10px 0 22px}.preview{max-width:375px;margin:auto;border:10px solid #34493b;border-radius:26px;overflow:hidden;background:white;box-shadow:0 16px 40px #80674c55}.roombar{height:56px;display:grid;place-items:center;background:linear-gradient(90deg,#d7c9c0,#bedaf0);font-size:14px;color:#4e564d}.preview video{display:block;width:100%;max-height:500px;object-fit:contain;background:#fff}.caption{padding:14px;text-align:center;font-size:14px;color:#665f56;background:#fbfbf7}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin:22px auto;max-width:720px}.choice{border:2px solid #d5c8b8;border-radius:14px;background:#fffdf8;padding:15px;cursor:pointer}.choice:hover,.choice.selected{border-color:#c98d3e;background:#fff5d5}.choice b{display:block;margin-bottom:5px}@media(max-width:540px){body{padding:18px}.choices{grid-template-columns:1fr}}
  </style>
</head>
<body><main>
  <h1>笑起来时，房间怎么办？</h1><p class="sub">这里播放的是你的原视频与原声，没有替换或修改。请先点播放看一下。</p>
  <section class="preview"><div class="roombar">待机：复古漫画房 · 白地板</div><video controls playsinline src="/files/laugh-original.mp4">你的浏览器无法播放此视频。</video><p class="caption">视频结束后，会自动返回房间待机画面。</p></section>
  <section class="choices"><article class="choice" data-choice="video-full" onclick="toggleSelect(this)"><b>A. 完整切到原视频</b><span>笑时完全呈现视频原来的画面；最忠实，切换也最干净。</span></article><article class="choice" data-choice="room-remains" onclick="toggleSelect(this)"><b>B. 房间仍在后面</b><span>只把角色笑的动作叠在房间里；需要额外处理视频的背景。</span></article></section>
</main></body></html>
