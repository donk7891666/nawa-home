<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复古漫画房 · 白地板版</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:#2e302d; background:#f4eee2; font-family:"Microsoft YaHei",system-ui,sans-serif; }
    main { width:min(840px,100%); }
    h1 { margin:0; text-align:center; font-size:clamp(26px,5vw,42px); }
    .sub { text-align:center; margin:10px 0 22px; color:#665f56; }
    .room { height:min(65vh,560px); min-height:380px; position:relative; overflow:hidden; border:12px solid #34493b; border-radius:24px; background:linear-gradient(#d7c9c0 0 72%,#fbfbf7 72%); box-shadow:0 18px 45px #6a554044; }
    .floor-lines { position:absolute; z-index:1; left:0; right:0; bottom:0; height:28%; background:repeating-linear-gradient(90deg,transparent 0 76px,#e5e2dc 77px 79px); border-top:5px solid #d9d5cd; }
    .floor-lines:after { content:""; position:absolute; left:0; right:0; top:48%; border-top:2px solid #eeeae3; }
    .picture { position:absolute; top:44px; left:52px; width:132px; height:120px; border:10px solid #5d7a65; background:repeating-linear-gradient(135deg,#e9b457 0 14px,#e7905c 14px 28px); transform:rotate(-4deg); }
    .window { position:absolute; top:42px; right:48px; width:112px; height:138px; border:9px solid #f7e6ba; background:#a5d4e9; box-shadow:inset 0 0 0 4px #527ea4; }
    .window:before,.window:after { content:""; position:absolute; background:#f7e6ba; }.window:before{height:7px;left:0;right:0;top:55px}.window:after{width:7px;top:0;bottom:0;left:43px}
    .plant { position:absolute; z-index:2; bottom:104px; left:46px; width:58px; height:80px; border-radius:50% 50% 17% 17%; background:#7b573f; }.plant:before{content:"🌿";position:absolute;left:-13px;top:-70px;font-size:82px;transform:rotate(-14deg)}
    .character { position:absolute; z-index:3; height:79%; bottom:24px; left:51%; transform:translateX(-50%); object-fit:contain; mix-blend-mode:multiply; }
    .note { margin:18px 0 0; padding:14px 18px; border-radius:14px; background:#fffdf8; color:#5b554d; text-align:center; }
    @media(max-width:540px){.room{min-height:420px}.picture{left:18px;top:55px;width:95px;height:88px}.window{right:18px;top:52px;width:88px;height:108px}.character{height:70%;bottom:45px}.plant{left:20px;bottom:105px}}
  </style>
</head>
<body>
  <main>
    <h1>C. 复古漫画房</h1>
    <p class="sub">白色地板版：让黄色角色更突出，空间也更轻快。</p>
    <section class="room" aria-label="小黄站在复古漫画房">
      <div class="picture"></div><div class="window"></div><div class="plant"></div><div class="floor-lines"></div>
      <img class="character" src="/files/character.jpg" alt="小黄">
    </section>
    <p class="note">这是房间的待机画面草图；触碰小黄后会切换到你的原视频，播完再回到这里。</p>
  </main>
</body>
</html>
