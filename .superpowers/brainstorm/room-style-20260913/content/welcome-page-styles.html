<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奶蛙之家欢迎页</title><style>
*{box-sizing:border-box}body{margin:0;padding:26px;background:#f4eee2;color:#27342b;font-family:"Microsoft YaHei",system-ui,sans-serif}h1{text-align:center;margin:0;font-size:clamp(25px,5vw,40px)}.sub{text-align:center;color:#665f56;margin:10px auto 26px}.cards{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:22px;max-width:840px;margin:auto}.card{overflow:hidden;border:3px solid transparent;border-radius:22px;background:#fffdf8;box-shadow:0 12px 34px #7a674128;cursor:pointer;transition:.15s}.card:hover,.card.selected{border-color:#d49a3e;transform:translateY(-5px)}.phone{position:relative;height:470px;overflow:hidden;background:#d7c9c0}.phone:after{content:"";position:absolute;z-index:0;left:0;right:0;bottom:0;height:29%;background:#fbfbf7;border-top:5px solid #dedad1}.content{position:relative;z-index:2;height:100%;padding:45px 28px;text-align:center;display:flex;flex-direction:column;align-items:center}.eyebrow{letter-spacing:3px;font-size:12px;color:#637268}.phone h2{margin:11px 0 7px;font-size:30px}.credit{font-size:14px;color:#71695d}.btn{margin-top:auto;margin-bottom:35px;border:0;border-radius:99px;padding:14px 34px;background:#405b49;color:#fffdf5;font:inherit;font-size:17px;box-shadow:0 6px 0 #253a2d}.frog{position:absolute;z-index:1;height:255px;bottom:40px;left:50%;transform:translateX(-50%);object-fit:contain;mix-blend-mode:multiply}.door{position:absolute;z-index:1;left:50%;bottom:29%;transform:translateX(-50%);width:128px;height:225px;border:12px solid #e5c681;border-bottom:0;background:#6e9d91}.door:before{content:"✦";position:absolute;color:#fdf2b2;font-size:45px;left:31px;top:48px}.doorfrog{height:210px;bottom:38px}.label{padding:16px 18px 18px}.label b{display:block;font-size:18px;margin-bottom:4px}.label span{color:#71695d;font-size:14px;line-height:1.5}@media(max-width:650px){body{padding:18px}.cards{grid-template-columns:1fr}.phone{height:430px}}
</style></head><body><h1>欢迎页想是什么感觉？</h1><p class="sub">两种方案都会进入同一个房间游戏页。</p><main class="cards"><article class="card" data-choice="frog-welcome" onclick="toggleSelect(this)"><div class="phone"><img class="frog" src="/files/character.jpg" alt="奶蛙"><div class="content"><div class="eyebrow">WELCOME</div><h2>欢迎来到<br>奶蛙之家</h2><p class="credit">袁启帆（donk）制作</p><button class="btn">进入游戏</button></div></div><div class="label"><b>A. 奶蛙先来迎接你</b><span>进入前就见到奶蛙，亲切直接。</span></div></article><article class="card" data-choice="door-welcome" onclick="toggleSelect(this)"><div class="phone"><div class="door"></div><img class="frog doorfrog" src="/files/character.jpg" alt="奶蛙"><div class="content"><div class="eyebrow">WELCOME</div><h2>欢迎来到<br>奶蛙之家</h2><p class="credit">袁启帆（donk）制作</p><button class="btn">推门进入</button></div></div><div class="label"><b>B. 像打开一扇门</b><span>欢迎页更像入口，游戏页再完整揭晓房间。</span></div></article></main></body></html>
